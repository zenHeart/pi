# book/upstream.lock — snapshot sync record for pi-book v8.1.0
#
# This file records the upstream and base SHAs that the book build was
# reconciled against, plus a build gate summary. It is **not** a content
# lock of the generated EPUB artifact.
#
# An EPUB is a ZIP of freshly-rendered Mermaid SVGs and XHTML chapters, so
# its byte content is non-deterministic across fresh builds (different SVG
# host strings, different timestamps inside the archive, etc.). The artifact
# SHA256 / exact byte size therefore **cannot** be a reproducible lock value.
# When a single-build SHA is needed for audit, capture it from the build run
# (CI artifact or local Issue note) and treat it as observational evidence,
# not as a contract.

